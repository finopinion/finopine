# ---------------------------------------------------------------------------
# Writes one opinion piece a day, then waits for you to approve it.
#
# HOW THE APPROVAL WORKS
# The second job targets an environment called "publish". If you add yourself
# as a required reviewer on that environment, GitHub emails you when a run is
# waiting, the email links to the run Summary which contains the ENTIRE draft,
# and you approve or reject in one tap. No email parsing, no tokens, nothing
# to host.
#
#   Settings -> Environments -> New environment -> name it exactly: publish
#   Tick "Required reviewers", add yourself, Save.
#
# IF YOU DO NOT SET THAT UP, this still works - GitHub creates the environment
# on the fly with no protection rules and the job runs straight through, fully
# automated. That is the fallback you asked for: it publishes, and you can pull
# a piece afterwards by setting draft: true in the web editor.
#
# Either way the draft is committed first with draft: true, so nothing reaches
# the site until it is approved. Rejecting leaves it in the repo as a draft.
#
# Cron in Actions is ALWAYS UTC. 01:30 UTC = 07:00 IST = 11:30 AEST, Mon-Fri.
# ---------------------------------------------------------------------------
name: Daily wire

on:
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.gen.outputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install

      - name: Confirm the feeds are reachable
        run: node scripts/check-feeds.mjs
        continue-on-error: true

      # POLL FIRST, rather than trusting the hourly watcher to have run recently.
      #
      # On 2 September the wire fired at 01:41 and the watcher queued that day's
      # item at 02:24 - 43 minutes too late. The queue held only the previous
      # day's subject, which had already been written about. Australian news
      # lands roughly 23:00-04:00 UTC, and Actions cron is not punctual, so any
      # fixed offset between the two jobs will sometimes miss.
      #
      # Polling inline removes the dependency: the queue is always current as of
      # this run. The hourly watcher still exists to catch breaking events
      # between wires.
      - name: Refresh the queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/poll-events.mjs
        continue-on-error: true

      # STAGE 2 - Haiku decides whether anything in the queue is worth an
      # argument. Publishing nothing is a valid outcome here.
      - name: Vet the event queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/vet-events.mjs
        continue-on-error: true

      # STAGE 3 - Opus writes. Uses the vetted event if there is one, otherwise
      # falls back to the scheduled candidate pool.
      - name: Draft one piece
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-article.mjs


      # KEEP THE DRAFT WHATEVER HAPPENS, THEN VALIDATE.
      #
      # The draft is uploaded as an artifact before anything can reject it, so a
      # failed run leaves a downloadable file rather than nothing. Two finished
      # articles were lost before this existed.
      #
      # Validation must run BEFORE the commit, not after: Astro validates every
      # content file including drafts, so committing an invalid one to main
      # would break the Cloudflare build for the whole site, not just this piece.
      - name: Keep the draft even if it fails
        if: steps.gen.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ github.run_number }}
          path: ${{ steps.gen.outputs.file }}
          retention-days: 30

      - name: Schema and language gates
        if: steps.gen.outputs.file != ''
        run: |
          npm run build
          npm run check:compliance
          npm run check:readability || true

      - name: Commit as an unpublished draft
        if: steps.gen.outputs.file != ''
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "wire: draft $(date -u +%F) [skip ci]"
            git push
          fi


  publish:
    needs: draft
    if: needs.draft.outputs.file != ''
    runs-on: ubuntu-latest
    # Approval gate. No reviewers configured = runs straight through.
    environment: publish
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: git pull --rebase

      - name: Publish it
        run: |
          sed -i 's/^draft: true$/draft: false/' "${{ needs.draft.outputs.file }}"
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          git add -A
          git commit -m "wire: publish $(basename '${{ needs.draft.outputs.file }}')"
          git push
          echo "Published. Cloudflare rebuilds on this push." >> $GITHUB_STEP_SUMMARY
