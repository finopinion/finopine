# ---------------------------------------------------------------------------
# THE WIRE. Up to three pieces a weekday, one per regional morning.
#
#   22:30 UTC Sun-Thu  = 08:30 Mon-Fri in Sydney    focus: Australia
#   08:30 UTC Mon-Fri  = 09:30 in London            focus: United Kingdom
#   13:30 UTC Mon-Fri  = 09:30 in New York          focus: United States
#
# Cron is ALWAYS UTC, so local times drift an hour when clocks change - Sydney
# in October, London and New York in late October and early November. They
# stay mornings.
#
# "Up to" is deliberate. A run may decline when nothing supports an argument
# worth publishing. That is the system refusing to pad, not a failure.
#
# Each run leans toward its region's news but is not confined to it: a strong
# piece about somewhere else beats a weak local one.
#
# APPROVAL (optional): Settings -> Environments -> New environment -> "publish"
# -> Required reviewers -> add yourself. Without it, pieces publish straight
# through and can be pulled afterwards by setting draft: true.
# ---------------------------------------------------------------------------
name: Wire

on:
  schedule:
    - cron: '30 22 * * 0-4'
    - cron: '30 8 * * 1-5'
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Lean toward a country: au, uk, us, ca, in or nz. Leave blank for none.'
        required: false
        default: ''

permissions:
  contents: write

# Never two wires at once. A second run waits rather than racing the first to
# push, which would fail after the writing had already been paid for.
concurrency:
  group: wire
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    # An untimed fetch once held a run for ten minutes. Cap it so a hang
    # cannot burn an hour of runner time.
    timeout-minutes: 20
    outputs:
      file: ${{ steps.gen.outputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install

      # Inputs go through env and are checked against known codes, never
      # interpolated straight into the shell.
      - name: Work out this run's focus
        id: focus
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT_FOCUS: ${{ github.event.inputs.focus }}
        run: |
          case "$SCHED" in
            "30 22 * * 0-4") f=au ;;
            "30 8 * * 1-5")  f=uk ;;
            "30 13 * * 1-5") f=us ;;
            *)               f="$INPUT_FOCUS" ;;
          esac
          case "$f" in au|nz|uk|ca|us|in) ;; *) f="" ;; esac
          echo "focus=$f" >> "$GITHUB_OUTPUT"
          echo "Focus for this run: ${f:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the feeds are reachable
        run: node scripts/check-feeds.mjs
        continue-on-error: true

      # Poll inline rather than trusting the hourly watcher's timing. A fixed
      # offset between two cron jobs will sometimes miss, because Actions cron
      # is not punctual.
      - name: Refresh the queue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/poll-events.mjs
        continue-on-error: true

      - name: Vet the event queue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOCUS: ${{ steps.focus.outputs.focus }}
        run: node scripts/vet-events.mjs
        continue-on-error: true

      # Reads each news candidate, follows its links to the primary document
      # behind it, and argues from that. May decline.
      - name: Draft one piece
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOCUS: ${{ steps.focus.outputs.focus }}
        run: node scripts/generate-article.mjs

      # Keep the draft whatever happens, then validate. Validation runs BEFORE
      # the commit: Astro validates every content file including drafts, so an
      # invalid one on main would break the build for the whole site.
      - name: Keep the draft even if it fails
        if: steps.gen.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ github.run_number }}
          path: ${{ steps.gen.outputs.file }}
          retention-days: 30

      - name: Schema and language gates
        if: steps.gen.outputs.file != ''
        run: |
          npm run build
          npm run check:compliance
          npm run check:readability || true

      # The hourly watcher commits too. Rebase onto whatever landed while this
      # run was writing, instead of failing the push after paying for the piece.
      - name: Commit as an unpublished draft
        if: steps.gen.outputs.file != ''
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "wire: draft $(date -u +%F) [skip ci]"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi

      # Keep the queue even when nothing was written, so a declined subject is
      # not reconsidered at the next run's expense.
      - name: Keep pipeline state
        if: always()
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          if [ -n "$(git status --porcelain events-queue.json events-seen.json)" ]; then
            git add events-queue.json events-seen.json
            git commit -m "wire: queue state [skip ci]"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi

  publish:
    needs: draft
    if: needs.draft.outputs.file != ''
    runs-on: ubuntu-latest
    # Approval gate. No reviewers configured = runs straight through.
    environment: publish
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - name: Publish it
        env:
          FILE: ${{ needs.draft.outputs.file }}
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          git pull --rebase
          sed -i 's/^draft: true$/draft: false/' "$FILE"
          git add -A
          git commit -m "wire: publish $(basename "$FILE")"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          echo "Published. Cloudflare rebuilds on this push." >> "$GITHUB_STEP_SUMMARY"
