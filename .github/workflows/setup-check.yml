# ---------------------------------------------------------------------------
# Run from the Actions tab: Setup check -> Run workflow. Also runs weekly.
#
# Commits what it learns so the rest of the system can act on it:
#   feeds.json  - which sources the watcher and the wire may read
#   wire.json   - which sources render as links on the public Wire page
#
# The Summary needs no login to read and works on a phone, unlike the raw
# logs, which is why the diagnostics go there.
# ---------------------------------------------------------------------------
name: Setup check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'   # Sunday 19:00 UTC. Cron is always UTC.

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install

      - name: Which models does the poller have access to?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "**GEMINI_API_KEY is not set.**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Available Gemini models"
            echo '```'
            curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY" \
              | grep -o '"name": "models/[^"]*"' | sed 's/"name": "models\///;s/"//' | sort \
              || echo "key rejected or endpoint changed"
            echo '```'
            echo "Ladder in models.json:"
            echo '```'
            grep -o '"gemini-[^"]*"' models.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Which feeds are alive?
        run: node scripts/check-feeds.mjs
        continue-on-error: true

      # Nothing on the public Wire page renders until this has confirmed the URL
      # responds. Without it the page is empty and drops out of the navigation.
      - name: Which Wire sources resolve?
        run: node scripts/check-wire.mjs
        continue-on-error: true

      - name: Do the published citations still resolve?
        run: node scripts/check-sources.mjs
        continue-on-error: true

      # TWO COMMITS, DELIBERATELY. feeds.json affects no published page, so it is
      # tagged [skip ci] and Cloudflare ignores it. wire.json IS a published page,
      # so its commit must trigger a build - lumping the two under one [skip ci]
      # once meant links verified and never appeared.
      - name: Commit feed status
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          if [ -n "$(git status --porcelain feeds.json)" ]; then
            git add feeds.json
            git commit -m "checks: feed status refreshed [skip ci]"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
            echo "Feed status committed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit wire status
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          if [ -n "$(git status --porcelain wire.json)" ]; then
            git add wire.json
            git commit -m "checks: wire link status refreshed"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
            echo "Wire status committed. Site will rebuild." >> "$GITHUB_STEP_SUMMARY"
          fi
