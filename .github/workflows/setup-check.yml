# ---------------------------------------------------------------------------
# Run this FIRST, from the Actions tab, before enabling any schedule.
# Actions -> Setup check -> Run workflow.
#
# It answers the three questions that block the generator, and writes the
# answers to the run Summary page. The Summary needs no authentication to read
# and works on a phone, unlike the raw logs.
#
# Nothing here writes to the repo. It only reports.
# ---------------------------------------------------------------------------
name: Setup check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install

      - name: Is the API key present and working, and which models exist?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "## API key" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**GEMINI_API_KEY is not set.** Add it under Settings -> Secrets and variables -> Actions." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## Available models" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copy the ones you want into models.json, newest first." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY" \
            | grep -o '"name": "models/[^"]*"' | sed 's/"name": "models\///;s/"//' \
            | sort >> $GITHUB_STEP_SUMMARY || echo "key rejected or endpoint changed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ladder currently in models.json:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -o '"gemini[^"]*"' models.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Which feeds are actually alive?
        run: node scripts/check-feeds.mjs
        continue-on-error: true

      - name: Do the published citations still resolve?
        run: node scripts/check-sources.mjs
        continue-on-error: true
