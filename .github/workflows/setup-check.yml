# ---------------------------------------------------------------------------
# Run from the Actions tab: Setup check -> Run workflow.
#
# Answers the three questions that block the pipeline, writes them to the run
# Summary, and commits the feed verification result so the poller can act on it.
#
# The Summary needs no authentication to read and works on a phone, unlike the
# raw logs. That is the whole reason the diagnostics go there.
#
# The commit is tagged [skip ci] because a feed status change affects no
# published page, and every unnecessary Cloudflare build eats a free-tier
# allowance of 500 a month.
# ---------------------------------------------------------------------------
name: Setup check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install

      - name: Is the API key present and working, and which models exist?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "## API key" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**GEMINI_API_KEY is not set.** Add it under Settings -> Secrets and variables -> Actions." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## Available models" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copy the ones you want into models.json, newest first." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY" \
            | grep -o '"name": "models/[^"]*"' | sed 's/"name": "models\///;s/"//' \
            | sort >> $GITHUB_STEP_SUMMARY || echo "key rejected or endpoint changed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ladder currently in models.json:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -o '"gemini-[^"]*"' models.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Which feeds are actually alive?
        run: node scripts/check-feeds.mjs
        continue-on-error: true

      - name: Do the published citations still resolve?
        run: node scripts/check-sources.mjs
        continue-on-error: true

      # check-feeds rewrites feeds.json with an honest verified flag. Without
      # this step the result is reported and thrown away, and the poller keeps
      # refusing to read feeds it has no record of confirming.
      - name: Commit verified feed status
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          if [ -n "$(git status --porcelain feeds.json)" ]; then
            git add feeds.json
            git commit -m "feeds: verified status refreshed [skip ci]"
            git pull --rebase --autostash
            git push
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Feed status committed." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No change to feed status." >> $GITHUB_STEP_SUMMARY
          fi
