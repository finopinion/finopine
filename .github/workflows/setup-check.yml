# ---------------------------------------------------------------------------
# Run from the Actions tab: Setup check -> Run workflow.
#
# Answers the questions that block the pipeline, writes them to the run Summary,
# and commits what it learns so the rest of the system can act on it:
#   feeds.json  - which sources the watcher and generator may read
#   wire.json   - which sources render as links on the public Wire page
#
# The Summary needs no authentication to read and works on a phone, unlike the
# raw logs. That is the whole reason the diagnostics go there.
#
# The commit is tagged [skip ci] because a status change affects no published
# page, and every unnecessary Cloudflare build eats a free-tier allowance of
# 500 a month.
# ---------------------------------------------------------------------------
name: Setup check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'   # Sunday 19:00 UTC. Cron is always UTC.

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install

      - name: Is the API key present and working, and which models exist?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "## API key" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**GEMINI_API_KEY is not set.** Add it under Settings -> Secrets and variables -> Actions." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## Available models" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copy the ones you want into models.json, newest first." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY" \
            | grep -o '"name": "models/[^"]*"' | sed 's/"name": "models\///;s/"//' \
            | sort >> $GITHUB_STEP_SUMMARY || echo "key rejected or endpoint changed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ladder currently in models.json:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -o '"gemini-[^"]*"' models.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Which feeds are actually alive?
        run: node scripts/check-feeds.mjs
        continue-on-error: true

      # Nothing on the public Wire page renders as a link until this has run and
      # confirmed the URL responds. Without it the directory is a list of names.
      - name: Which Wire sources resolve?
        run: node scripts/check-wire.mjs
        continue-on-error: true

      - name: Do the published citations still resolve?
        run: node scripts/check-sources.mjs
        continue-on-error: true

      - name: Commit what the checks learned
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          if [ -n "$(git status --porcelain feeds.json wire.json)" ]; then
            git add feeds.json wire.json
            git commit -m "checks: feed and wire status refreshed [skip ci]"
            git pull --rebase --autostash
            git push
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Feed and wire status committed." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No change to feed or wire status." >> $GITHUB_STEP_SUMMARY
          fi
