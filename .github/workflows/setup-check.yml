      # TWO COMMITS, DELIBERATELY.
      #
      # feeds.json affects no published page, so it is tagged [skip ci] and
      # Cloudflare ignores it. wire.json IS a published page - it is what the
      # Wire renders - so its commit must trigger a build. Lumping them
      # together under one [skip ci] meant the links verified and never
      # appeared.
      - name: Commit feed status
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          if [ -n "$(git status --porcelain feeds.json)" ]; then
            git add feeds.json
            git commit -m "checks: feed status refreshed [skip ci]"
            git pull --rebase --autostash
            git push
            echo "Feed status committed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit wire status
        run: |
          git config user.name  "FinOpine"
          git config user.email "Finopine09@gmail.com"
          if [ -n "$(git status --porcelain wire.json)" ]; then
            git add wire.json
            git commit -m "checks: wire link status refreshed"
            git pull --rebase --autostash
            git push
            echo "Wire status committed. Site will rebuild." >> $GITHUB_STEP_SUMMARY
          fi
